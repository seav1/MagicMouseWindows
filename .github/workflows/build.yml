name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore dependencies
        run: dotnet restore src/MagicMouseApp/MagicMouseApp.csproj

      - name: Publish (single-file, self-contained, win-x64)
        run: >
          dotnet publish src/MagicMouseApp/MagicMouseApp.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishReadyToRun=false
          -o publish

      - name: Verify artifact
        shell: pwsh
        run: |
          if (-not (Test-Path "publish/MagicMouseApp.exe")) {
            Write-Error "MagicMouseApp.exe was not produced"
            exit 1
          }
          Get-Item "publish/MagicMouseApp.exe" | Format-List FullName,Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MagicMouseApp
          path: publish/MagicMouseApp.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/MagicMouseApp.exe
          body: |
            ## Magic Mouse Windows ${{ github.ref_name }}

            Compatible with **Windows 10 (1607+) and Windows 11**, x64.

            ### Installation
            See [README](https://github.com/seav1/MagicMouseWindows#-quick-start) for full setup instructions.

            ### Download
            Download `MagicMouseApp.exe` below and run it directly - no installation needed.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
