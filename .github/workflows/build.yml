name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify embedded driver files are present
        shell: pwsh
        working-directory: src\MagicMouse
        run: |
          $missing = @()
          foreach ($f in 'drivers/MagicMouse.inf','drivers/MagicMouse.sys','drivers/MagicMouse.cat') {
            if (-not (Test-Path $f)) { $missing += $f }
          }
          if ($missing.Count -gt 0) {
            Write-Error "Missing driver files: $($missing -join ', ')"
            Write-Error "These must be committed to git, otherwise the rc.exe step fails with RC2135."
            exit 1
          }
          Get-ChildItem drivers | Format-Table Name,Length -AutoSize

      - name: Compile MagicMouse.exe
        shell: cmd
        working-directory: src\MagicMouse
        run: |
          if not exist build mkdir build
          rc /nologo /fo build\MagicMouse.res MagicMouse.rc
          cl /nologo /O2 /MT /EHsc /W3 /GS- ^
             /DUNICODE /D_UNICODE /D_WIN32_WINNT=0x0A00 /DWIN32_LEAN_AND_MEAN ^
             /Fe:build\MagicMouse.exe /Fo:build\ ^
             MagicMouse.cpp build\MagicMouse.res ^
             /link /SUBSYSTEM:WINDOWS ^
             setupapi.lib newdev.lib user32.lib shell32.lib advapi32.lib gdi32.lib ole32.lib kernel32.lib

      - name: Verify artifact
        shell: pwsh
        run: |
          $exe = "src/MagicMouse/build/MagicMouse.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "MagicMouse.exe was not produced"
            exit 1
          }
          Get-Item $exe | Format-List FullName, Length, VersionInfo

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MagicMouse
          path: src/MagicMouse/build/MagicMouse.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src/MagicMouse/build/MagicMouse.exe
          body: |
            ## Magic Mouse Windows ${{ github.ref_name }}

            Native Win32 build, no .NET / runtime required. The Magic Mouse
            kernel driver is embedded inside the .exe and auto-installed on
            first run (you'll see one UAC prompt).

            **Compatible with:** Windows 10 (1607+) and Windows 11, x64.
            **Size:** ~6.5 MB single `.exe` (driver bundled).

            Just download `MagicMouse.exe` and run it. See the
            [README](https://github.com/seav1/MagicMouseWindows#quick-start)
            for details.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
